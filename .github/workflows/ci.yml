name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: Test Rust workspace
        shell: pwsh
        run: cargo +stable-x86_64-pc-windows-msvc test --workspace --all-targets --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Python servers
        run: python3 -m unittest discover -s servers -p 'test_*.py'

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate documentation website
        run: npm run build
