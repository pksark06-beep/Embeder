name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust MSVC toolchain
        shell: pwsh
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: Run default test suite
        shell: pwsh
        run: cargo +stable-x86_64-pc-windows-msvc test --workspace --all-targets --locked
      - name: Install Tauri CLI
        shell: pwsh
        run: cargo +stable-x86_64-pc-windows-msvc install tauri-cli --version "2.11.4" --locked
      - name: Build Windows bundles
        shell: pwsh
        working-directory: desktop/src-tauri
        run: cargo +stable-x86_64-pc-windows-msvc tauri build --target x86_64-pc-windows-msvc
      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item -Path "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/Embeder_*-setup.exe" -Destination artifacts
          Copy-Item -Path "desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/Embeder_*.msi" -Destination artifacts
          $files = Get-ChildItem -LiteralPath artifacts -File | Sort-Object Name
          $checksums = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash
            "$hash  $($file.Name)"
          }
          Set-Content -LiteralPath artifacts/SHA256SUMS.txt -Value $checksums -Encoding ascii
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@1e69f48acb82d1966a394da916b4c1698aa569d6 # v1
        with:
          subject-path: artifacts/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-bundles
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-bundles
          path: artifacts
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = Get-ChildItem -LiteralPath artifacts -File | ForEach-Object { $_.FullName }
          $releaseArgs = @("release", "create", $tag) + $assets + @("--verify-tag", "--title", "Embeder $tag")
          $notesPath = "docs/releases/$tag.md"
          if (Test-Path -LiteralPath $notesPath) {
            $releaseArgs += @("--notes-file", $notesPath)
          } else {
            $releaseArgs += "--generate-notes"
          }
          & gh @releaseArgs
