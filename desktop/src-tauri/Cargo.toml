[package]
name = "embeder-tauri"
version = "0.2.0"
edition = "2021"
description = "Embeder native desktop shell (ADR-0006). Loads desktop/dist and exposes the shared desktop API as Tauri commands."
license = "MPL-2.0"
#
# Excluded from the root workspace: Tauri's native build uses WebView2 + the MSVC
# toolchain. Build with the MSVC Rust toolchain, e.g.:
#   cargo +stable-x86_64-pc-windows-msvc run --manifest-path desktop/src-tauri/Cargo.toml

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
embeder-desktop-api = { path = "../api" }

# Keep local native builds practical on machines with limited disk space.
[profile.dev]
debug = 0
incremental = false
