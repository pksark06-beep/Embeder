[package]
name = "embeder-desktop"
version = "0.1.0"
edition = "2021"
description = "Embeder desktop dev server: serves the UI and runs the verification loop behind a tiny std-only HTTP API. Verifiable stand-in for the Tauri command layer (ADR-0006)."
# license: TBD — see OD-5

[dependencies]
embeder-core = { path = "../../core" }
embeder-datasheet = { path = "../../datasheet" }
serde_json = "1"

[[bin]]
name = "embeder-desktop"
path = "src/main.rs"
