[package]
name = "embeder-desktop"
version = "0.2.0"
edition = "2021"
description = "Embeder desktop dev server: serves the UI and exposes the shared desktop API over a tiny std-only HTTP layer (ADR-0006)."
# license: TBD — see OD-5

[dependencies]
embeder-desktop-api = { path = "../api" }
serde_json = "1"

[dev-dependencies]
embeder-mcp = { path = "../../mcp" }

[[bin]]
name = "embeder-desktop"
path = "src/main.rs"
