# Embeder Rust workspace (ADR-0006). The Core is dependency-free; the datasheet
# crate isolates the one dependency it genuinely needs (an XML parser for CMSIS-SVD).
[workspace]
resolver = "2"
members = ["core", "datasheet", "mcp", "desktop/api", "desktop/server"]
# The Tauri native shell has heavy platform deps (webview) and needs the MSVC
# toolchain on Windows; keep it out of the verified workspace build.
exclude = ["desktop/src-tauri"]
